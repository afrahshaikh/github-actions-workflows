name: Stale Issues

on:
  schedule:
    - cron: "0 1 * * *"

jobs:

  stale:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 1
          days-before-close: 7
          stale-issue-message: "This issue has become stale."
          stale-pr-message: "This pull request has become stale."
