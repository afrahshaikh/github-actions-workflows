name: Auto Merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:

  automerge:

    runs-on: ubuntu-latest

    if: github.actor == 'dependabot[bot]'

    steps:
      - uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash